storage: /verdaccio/storage
# Cache misses go upstream through the host proxy; setup.sh rewrites these two lines from HOST_PROXY.
http_proxy: http://127.0.0.1:7897
https_proxy: http://127.0.0.1:7897
no_proxy: 127.0.0.1,localhost,192.168.122.0/24
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 60s
    max_fails: 20
    fail_timeout: 5m
packages:
  '@*/*':
    access: $all
    proxy: npmjs
  '**':
    access: $all
    proxy: npmjs
server:
  listen: 192.168.122.1:4873
log: { type: stdout, format: pretty, level: warn }
max_body_size: 100mb
